<text x="10" y="20" font-size="11" fill="#4c5866">Renderer::Render() の 7 段階。中央の 2 段は「水を描く前の画」を屈折と厚み推定のために保存する。</text>
<text x="10" y="128" font-size="10" fill="#4c5866">HDR RT = R16G16B16A16_FLOAT。内部解像度はウィンドウの 2 倍 (SSAA)。最終段で 2×2 平均・トーンマップ・ガンマ補正。</text>
