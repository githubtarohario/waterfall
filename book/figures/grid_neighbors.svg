<text x="240" y="40" font-size="11" fill="#1a222b" font-weight="bold">セル幅 = h</text>
<text x="240" y="56" font-size="11" fill="#1a222b" font-weight="normal"></text>
<text x="240" y="72" font-size="11" fill="#1a222b" font-weight="normal">粒子 i (赤) の近傍候補は</text>
<text x="240" y="88" font-size="11" fill="#1a222b" font-weight="normal">自身のセルと隣接セル</text>
<text x="240" y="104" font-size="11" fill="#1a222b" font-weight="normal">(2D: 9 個, 3D: 27 個) だけ。</text>
<text x="240" y="120" font-size="11" fill="#1a222b" font-weight="normal"></text>
<text x="240" y="136" font-size="11" fill="#1a222b" font-weight="normal">同じセルの粒子は並べ替えで</text>
<text x="240" y="152" font-size="11" fill="#1a222b" font-weight="normal">メモリ上でも連続に並ぶので</text>
<text x="240" y="168" font-size="11" fill="#1a222b" font-weight="normal">cellStart[c] .. cellStart[c+1]</text>
<text x="240" y="184" font-size="11" fill="#1a222b" font-weight="normal">の範囲を走査すればよい。</text>
