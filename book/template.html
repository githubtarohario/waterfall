<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GPU で作る水しぶき ― SPH 法とマーチングキューブ法で学ぶリアルタイム流体 CG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<style>
  :root {
    --ink: #1a222b; --ink-2: #4c5866; --muted: #7b8794; --line: #d5dce3;
    --accent: #0f7f8a; --accent-ink: #0a5f68; --accent-soft: #d9eef0;
    --code-bg: #f4f6f8; --note-bg: #fff6e6; --note-line: #e0b060; --tip-bg: #eaf5f6;
  }
  @page { size: A4; margin: 18mm 17mm 20mm 17mm;
          @bottom-center { content: counter(page); font-family: "JetBrains Mono", monospace; font-size: 9pt; color: #7b8794; } }
  @page :first { @bottom-center { content: none; } }

  * { box-sizing: border-box; }
  html { font-size: 10.5pt; }
  body { margin: 0; color: var(--ink); background: #fff;
         font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif; line-height: 1.8;
         font-feature-settings: "palt"; }
  p { margin: 0 0 0.9em; text-align: justify; }
  a { color: var(--accent-ink); text-decoration: none; }
  strong { font-weight: 700; }

  /* ---- 表紙 ---- */
  .cover { height: 250mm; display: flex; flex-direction: column; justify-content: space-between; break-after: page; }
  .cover .kicker { font-family: "JetBrains Mono", monospace; font-size: 10pt; letter-spacing: .18em; color: var(--accent); }
  .cover h1.title { font-family: "Noto Serif JP", serif; font-weight: 900; font-size: 30pt; line-height: 1.3; margin: 12mm 0 4mm; }
  .cover .subtitle { font-family: "Noto Serif JP", serif; font-size: 15pt; color: var(--ink-2); margin: 0 0 10mm; }
  .cover img { width: 100%; border: 1px solid var(--line); }
  .cover .meta { font-size: 9.5pt; color: var(--ink-2); line-height: 1.7; }
  .cover .meta b { color: var(--ink); }

  /* ---- 目次 ---- */
  nav.toc { break-after: page; }
  nav.toc ol { list-style: none; padding: 0; margin: 0; columns: 1; }
  nav.toc li.lv1 { font-weight: 700; margin-top: 10px; font-size: 11.5pt; }
  nav.toc li.lv2 { padding-left: 1.6em; font-size: 10pt; color: var(--ink-2); }
  nav.toc a { color: inherit; }

  /* ---- 見出し ---- */
  h1 { font-family: "Noto Serif JP", serif; font-weight: 900; font-size: 22pt; line-height: 1.3;
       margin: 0 0 8mm; padding: 26mm 0 4mm; border-bottom: 3px solid var(--accent); break-before: page; break-after: avoid; }
  h1.toc-title { padding-top: 0; border: none; font-size: 20pt; }
  h1 .chap { display: block; font-family: "JetBrains Mono", monospace; font-size: 10pt; letter-spacing: .2em; color: var(--accent); font-weight: 600; margin-bottom: 4mm; }
  h2 { font-family: "Noto Serif JP", serif; font-weight: 700; font-size: 15pt; margin: 9mm 0 3mm; padding-left: 10px; border-left: 4px solid var(--accent); break-after: avoid; }
  h3 { font-weight: 700; font-size: 11.5pt; margin: 6mm 0 2mm; color: var(--accent-ink); break-after: avoid; }
  h4 { font-weight: 700; font-size: 10.5pt; margin: 4mm 0 1.5mm; break-after: avoid; }

  /* ---- 本文パーツ ---- */
  ul, ol { margin: 0 0 0.9em; padding-left: 1.6em; }
  li { margin-bottom: 0.25em; }
  .lead { font-size: 11pt; color: var(--ink-2); border-left: 3px solid var(--line); padding-left: 12px; margin-bottom: 1.2em; }
  .note, .tip, .warn { padding: 8px 14px; margin: 0.6em 0 1.1em; border-radius: 4px; break-inside: avoid; font-size: 10pt; }
  .note { background: var(--note-bg); border-left: 4px solid var(--note-line); }
  .tip  { background: var(--tip-bg);  border-left: 4px solid var(--accent); }
  .warn { background: #fdecea; border-left: 4px solid #c0392b; }
  .note::before, .tip::before, .warn::before { font-weight: 700; display: block; margin-bottom: 2px; }
  .note::before { content: "補足"; color: #9a6b10; }
  .tip::before  { content: "ポイント"; color: var(--accent-ink); }
  .warn::before { content: "注意"; color: #a93226; }
  .keyterm { background: var(--accent-soft); padding: 0 4px; border-radius: 3px; }

  code { font-family: "JetBrains Mono", Consolas, monospace; font-size: 0.88em; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; }
  pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px;
        font-size: 8.4pt; line-height: 1.45; white-space: pre-wrap; word-break: break-all; overflow-wrap: anywhere; }
  /* 合字 (<= → ≤ など) はコードの読解を妨げるので無効化 */
  code, pre { font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0, "dlig" 0; }
  pre code { background: none; padding: 0; font-size: inherit; }
  figure { margin: 0.8em 0 1.3em; break-inside: avoid; }
  figure.listing { break-inside: auto; }
  figure.listing figcaption { font-family: "JetBrains Mono", monospace; font-size: 8.5pt; color: var(--accent-ink); margin-bottom: 3px; break-after: avoid; }
  figure.listing pre { orphans: 4; widows: 4; }
  figure.fig { text-align: center; }
  figure.fig img { max-width: 100%; max-height: 210mm; border: 1px solid var(--line); }
  figure.fig figcaption { font-size: 9.5pt; color: var(--ink-2); margin-top: 6px; text-align: left; }
  figure.diagram { text-align: center; }
  figure.diagram svg { max-width: 100%; height: auto; }
  figure.diagram figcaption { font-size: 9.5pt; color: var(--ink-2); margin-top: 6px; text-align: left; }
  .mermaid-wrap { background: #f9fafb; border: 1px solid var(--line); border-radius: 4px; padding: 8px; }
  .mermaid-wrap svg { max-width: 100% !important; max-height: 200mm !important; width: auto !important; height: auto !important; display: block; margin: 0 auto; }

  table { border-collapse: collapse; width: 100%; font-size: 9.5pt; margin: 0.5em 0 1.2em; break-inside: avoid; }
  th, td { border: 1px solid var(--line); padding: 5px 8px; vertical-align: top; text-align: left; }
  th { background: #eef2f5; font-weight: 700; }
  td code { white-space: nowrap; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }

  .eq { margin: 0.5em 0 1em; }
  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .small { font-size: 9pt; color: var(--ink-2); }
  .colophon { font-size: 9.5pt; color: var(--ink-2); break-before: page; padding-top: 200mm; }
</style>
